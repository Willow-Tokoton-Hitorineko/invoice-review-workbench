<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>票据复核 · 合成演示</title>
<style>body{margin:0;background:#f4f1eb;color:#18232c;font:16px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:50px auto;padding:24px}h1{font-size:34px}textarea{width:100%;min-height:280px;box-sizing:border-box;padding:16px;border:1px solid #bdb7ae;background:#fffdfa;font:14px/1.5 monospace}button{padding:10px 18px;margin:12px 10px 12px 0;background:#20384a;color:white;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #ccc}p{max-width:760px}.note{color:#69747b}#message{white-space:pre-wrap}</style>
<main><p class="note">独立公开实现 · 合成数据 · 本机处理</p><h1>先核事实，再由人确认</h1><p>金额和重复编号由规则校验；科目、项目与实际发生日期由人提供。开票日期不会自动填作发生日期。此演示不识别扫描件，不包含公司模板或原系统代码。</p>
<button id="sample">载入合成示例</button><label for="input">票据 JSON（可直接编辑 human_approval）</label><textarea id="input" spellcheck="false"></textarea>
<button id="review">校验与复核</button><button id="export">全部通过后导出 CSV</button><p id="message" role="status"></p><table><thead><tr><th>编号</th><th>金额</th><th>状态</th><th>原因</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>const input=document.querySelector('#input'),message=document.querySelector('#message'),rows=document.querySelector('#rows');
async function sample(){input.value=JSON.stringify(await (await fetch('/sample')).json(),null,2)}
async function send(path){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:input.value});if(!r.ok){let e=await r.json();throw Error(e.error||'请求失败')}return r}
document.querySelector('#sample').onclick=()=>sample().catch(e=>message.textContent=e.message);
document.querySelector('#review').onclick=async()=>{try{const data=await(await send('/review')).json();rows.replaceChildren();for(const r of data){const tr=document.createElement('tr');for(const text of [r.invoice_id,r.amount??'无效',r.status,[...r.errors,...r.reasons].join('；')]){const td=document.createElement('td');td.textContent=text;tr.append(td)}rows.append(tr)}message.textContent='已核查。REVIEW 需人工确认，REJECT 需修正事实。'}catch(e){message.textContent=e.message}};
document.querySelector('#export').onclick=async()=>{try{const blob=await(await send('/export')).blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='approved-invoices.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message.textContent='导出完成，不在服务端保存。'}catch(e){message.textContent=e.message}};sample();</script></html>
